# ============================================================
# TODO (tiêu chí 12): cấu hình deploy Railway
#   [build]  builder = "DOCKERFILE"
#   [deploy] healthcheckPath = "/health"
#   App phải lắng nghe theo biến PORT do Railway cấp (xử lý trong CMD của Dockerfile).
#
# Chỉ cần một trong hai file railway.toml / render.yaml, nhưng file nào có nội dung thì phải đúng.
# ============================================================
# Railway config-as-code — https://docs.railway.com/reference/config-as-code
# Biến môi trường (AGENT_API_KEY, REDIS_URL, ...) đặt trên Railway Dashboard, không ghi ở đây.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Không đặt startCommand: dùng CMD của Dockerfile (đã lắng nghe theo $PORT)
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3